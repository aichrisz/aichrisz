<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Neon hotel sign: HOTEL aichrisz, vacancy">
  <defs>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="30" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="22" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flicker { animation: flicker 5s infinite; }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        90% { opacity: 1; } 91% { opacity: 0.35; } 92% { opacity: 1; }
        95% { opacity: 0.55; } 96% { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#070b16"/>
  <rect x="26" y="26" width="1148" height="368" rx="26" fill="none" stroke="#164e63" stroke-width="3"/>
  <rect x="26" y="26" width="1148" height="368" rx="26" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" filter="url(#glowCyan)"/>
  <text x="600" y="118" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="54" letter-spacing="30" fill="#a5f3fc" filter="url(#glowCyan)">HOTEL</text>
  <text x="600" y="252" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="128" font-weight="bold" letter-spacing="6" fill="#fbcfe8" filter="url(#glowPink)">aichrisz</text>
  <text x="600" y="340" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="40" letter-spacing="14" fill="#fde68a" filter="url(#glowAmber)" class="flicker">&#9733; VACANCY &#9733;</text>
</svg>
