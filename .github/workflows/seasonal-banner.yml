name: seasonal-banner

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Swap seasonal banner
        run: python scripts/seasonal_banner.py

      - name: Commit if changed
        run: |
          git config user.name "lobby-bot"
          git config user.email "lobby-bot@users.noreply.github.com"
          git add lobby-banner.gif
          git diff --quiet --cached || git commit -m "seasonal lobby banner" && git push
