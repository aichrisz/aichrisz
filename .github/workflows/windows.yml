name: hotel-windows

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution hotel
        run: python scripts/render_windows.py

      - name: Commit
        run: |
          git config user.name "lobby-bot"
          git config user.email "lobby-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add hotel-windows.svg README.md
          git diff --quiet --cached || git commit -m "🏨 update contribution hotel" && git push
