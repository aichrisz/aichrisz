name: Guestbook

on:
  issues:
    types: [opened, edited, deleted, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  issues: read
  contents: write

jobs:
  render:
    if: contains(github.event.issue.labels.*.name, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const START = '<!-- GUESTBOOK:START -->';
            const END = '<!-- GUESTBOOK:END -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'guestbook', state: 'open',
            });
            function parseForm(body) {
              const out = {};
              let cur = null;
              for (const line of String(body || '').split('\n')) {
                const h = /^### (.+)$/.exec(line.trimEnd());
                if (h) { cur = h[1].trim(); out[cur] = []; }
                else if (cur) out[cur].push(line);
              }
              for (const k of Object.keys(out)) {
                const v = out[k].join('\n').trim().replace(/\s+/g, ' ');
                out[k] = v === '_No response_' ? '' : v;
              }
              return out;
            }
            const lines = [];
            for (const i of issues) {
              if (i.pull_request) continue;
              const f = parseForm(i.body);
              const name = f['Name'] || i.user.login;
              const loc = f['Where are you visiting from?'] || '';
              const msg = f['Message'] || '';
              const date = String(i.created_at).slice(0, 10);
              const who = loc ? `**${name}** (${loc})` : `**${name}**`;
              const what = msg ? ` — ${msg.slice(0, 220)}` : '';
              lines.push(`- ${who}${what} · [${date}](${i.html_url})`);
            }
            const block = lines.length ? lines.join('\n')
              : '<!-- The first signature appears here once a guest signs. -->';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: 'README.md' });
            const content = Buffer.from(file.content, 'base64').toString('utf8');
            const s = content.indexOf(START);
            const e = content.indexOf(END);
            if (s === -1 || e === -1 || e < s) { console.log('guestbook: markers not found'); return; }
            const next = content.slice(0, s + START.length) + '\n' + block + '\n' + content.slice(e);
            if (next === content) { console.log('guestbook: no change'); return; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'README.md',
              message: 'chore: update guest book',
              content: Buffer.from(next).toString('base64'),
              sha: file.sha,
            });
            console.log(`guestbook: rendered ${lines.length} signatures`);
